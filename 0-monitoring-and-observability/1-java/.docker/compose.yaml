# Kiến trúc: Stack Docker lesson: monitoring and observability (Java/Spring Boot).
# (EN: Docker stack for lesson: monitoring and observability (Java/Spring Boot).)
#
# Demo: HTTP API cổng 3000 (hoặc theo compose); xem README module.
#
# Thư mục làm việc: 0-monitoring-and-observability/1-java/.docker
# (EN: Working directory: 0-monitoring-and-observability/1-java/.docker)
#
# Khởi chạy stack:
# (EN: Start stack:)
#   cd 0-monitoring-and-observability/1-java/.docker && docker compose up -d --build
#
# Xem log:
# (EN: View logs:)
#   docker compose logs -f
#
# Dọn dẹp:
# (EN: Cleanup:)
#   docker compose down -v
#
# =============================================================================
# Docker Compose — lesson `0-monitoring-and-observability` Java track
# (metrics-api Spring Boot + Prometheus + Grafana).
# (EN: Docker Compose — lesson `0-monitoring-and-observability` Java track.)
#
# Làm việc trong thư mục chứa file này: `.../0-monitoring-and-observability/1-java/.docker/`
# (EN: Run commands from this file's directory: `.../0-monitoring-and-observability/1-java/.docker/`)
#
# Compose tự tạo network `1-java-monitoring` khi `up` (không cần `docker network create`).
# (EN: Compose creates network `1-java-monitoring` on `up` (no manual `docker network create`).)
#
# Khởi chạy nền + build image trong compose (nếu có `build:`):
# (EN: Start detached + build images defined in compose (when `build:` is present).)
#     docker compose up -d --build
#
# Xem log Prometheus / app:
# (EN: Tail Prometheus / app logs.)
#     docker compose logs -f prometheus
#     docker compose logs -f app
#
# Dừng và gỡ container.
# (EN: Stop/remove containers.)
#     docker compose down
# =============================================================================

# Tiền tố project Compose (tên stack / tiền tố container).
# (EN: Compose project prefix (stack / container name prefix).)
name: 1-java-monitoring

services:
  # API Spring Boot expose `/actuator/prometheus` và `/cats`; hostname nội bộ `app` để Prometheus scrape.
  # In-memory store seeded with one Cat (Tom) — no postgres service needed.
  # (EN: Spring Boot API exposes `/actuator/prometheus` and `/cats`; internal hostname `app` for Prometheus scrape.
  #      In-memory store seeded with one Cat (Tom) — no postgres service needed.)
  app:
    build:
      context: ../metrics-api
    image: starciacademy/monitoring-and-observability-metrics-api-java:latest
    ports:
      # Ánh xạ cổng host 3000 → container 3000 (HTTP API).
      # (EN: Map host port 3000 → container 3000 (HTTP API).)
      - "3000:3000"
    networks:
      # Gắn network do Compose khai báo (tên Docker ở khối `networks`).
      # (EN: Attach Compose-declared network (Docker name under `networks` block).)
      - "1-java-monitoring"

  # Prometheus scrape `/actuator/prometheus` của service `app`.
  # (EN: Prometheus scrapes `/actuator/prometheus` from service `app`.)
  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      # Mount chỉ đọc file cấu hình scrape (`prometheus.yml` cạnh compose).
      # (EN: Read-only bind-mount scrape config (`prometheus.yml` next to compose).)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Ánh xạ host 9090 → Prometheus UI/API.
      # (EN: Map host 9090 → Prometheus UI/API.)
      - "9090:9090"
    depends_on:
      # Khởi động sau `app` (thứ tự khởi tạo; không chờ healthy).
      # (EN: Starts after `app` (startup order; no health-aware wait).)
      - app
    networks:
      - "1-java-monitoring"

  # Grafana — UI Explore/Dashboard; datasource Prometheus provisioning sẵn.
  # (EN: Grafana — Explore/Dashboard UI; Prometheus datasource provisioned.)
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      # Ánh xạ host 3001 → Grafana (container listen :3000).
      # (EN: Map host 3001 → Grafana (container listens on :3000).)
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - "1-java-monitoring"

# Network do Compose tạo; `name` đặt tên trên Docker trùng lesson (không `external`).
# (EN: Compose-managed network; `name` sets Docker network name to match lesson (not `external`).)
networks:
  "1-java-monitoring":
    name: "1-java-monitoring"
