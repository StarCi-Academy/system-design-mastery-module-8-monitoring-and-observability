# =============================================================================
# Docker Compose — lesson `1-centralized-logging` (Java): logging-api + Loki + Grafana.
#
# Working directory: `.../1-centralized-logging/1-java/.docker/`
#
# Start detached:   docker compose up -d --build
# Stop + remove:    docker compose down -v
# =============================================================================

name: 1-centralized-logging-java

services:
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - centralized-logging

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - loki
    networks:
      - centralized-logging

  # Spring Boot logging-api — pushes logs to Loki (Logback); captures errors with Sentry.
  logging-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LOKI_URL: http://loki:3100
      LOG_APP_NAME: logging-api
      LOG_ENV: lab
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - loki
    ports:
      - "3002:8080"
    networks:
      - centralized-logging

networks:
  centralized-logging:
    name: 1-centralized-logging-java
