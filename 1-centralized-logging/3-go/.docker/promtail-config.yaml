# Promtail config — discovers Docker containers and ships their stdout to Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only ship logs from the logging-api container; tag the stream with app + env labels.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: logging-api
        action: keep
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: app
        replacement: logging-api
      - target_label: env
        replacement: lab
