# Docker Compose — lesson `3-distributed-tracing` (Go tracing-api + Jaeger OTLP).
# (EN: Docker Compose — lesson `3-distributed-tracing` (Go tracing-api + Jaeger OTLP).)
#
# Thư mục làm việc: 3-distributed-tracing/3-go/.docker
# (EN: Working directory: 3-distributed-tracing/3-go/.docker)
#
# Khởi chạy stack:
# (EN: Start stack:)
#   cd 3-distributed-tracing/3-go/.docker && docker compose up -d --build
#
# Gọi API (host 3005 → container 3000) và mở Jaeger UI (host 16687):
# (EN: Call API (host 3005 → container 3000) and open Jaeger UI (host 16687).)
#     curl http://localhost:3005/checkout
#     open http://localhost:16687
#
# Dọn dẹp:
# (EN: Cleanup:)
#   docker compose down -v
# =============================================================================

# Tiền tố project Compose — trùng tên thư mục bài học (slug).
# (EN: Compose project prefix — matches lesson folder slug.)
name: 3-distributed-tracing-go

services:
  # VI: Jaeger all-in-one — trong container vẫn :16686 / :4318; map host 16687/4319 để tránh đụng Jaeger khác trên máy.
  # EN: Jaeger all-in-one — in-container still :16686 / :4318; host 16687/4319 avoids clashes with another local Jaeger.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16687:16686"
      - "4319:4318"
    networks:
      - "3-distributed-tracing-go"

  # VI: Go export trace OTLP — host 3005 → app :3000.
  # EN: Go OTLP trace export — host 3005 → app :3000.
  tracing-api:
    build:
      context: ../tracing-api
      dockerfile: Dockerfile
    environment:
      # Endpoint đầy đủ `/v1/traces` khớp exporter HTTP mặc định của lab.
      # (EN: Full `/v1/traces` path matches lab default HTTP exporter.)
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: go-tracing-app
      PORT: "3000"
    depends_on:
      - jaeger
    ports:
      - "3005:3000"
    networks:
      - "3-distributed-tracing-go"

# Network do Compose tạo; `name` trùng slug bài (không `external`).
# (EN: Compose-managed network; `name` matches lesson slug (not `external`).)
networks:
  "3-distributed-tracing-go":
    name: "3-distributed-tracing-go"
